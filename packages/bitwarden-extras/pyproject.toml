[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitwarden-extras"
version = "0.1.0"
description = "Modern Python 3.14 toolkit for Bitwarden (in-memory SQLite, safe sanitized exports, smart sync, vault cleaner)"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=13.7.0",
    "typer>=0.12.5",
    "types-pyyaml>=6.0.12.20240917",
    "whenever>=0.11.0",
]

[project.scripts]
bw-vault = "bitwarden_extras.cli:main"
bitwarden-vault = "bitwarden_extras.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bitwarden_extras"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
