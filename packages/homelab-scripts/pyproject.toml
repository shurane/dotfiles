[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-scripts"
version = "0.1.0"
description = "Collection of scripts and utilities for homelab"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
  "homelab-core",
  "anyio>=4.8.0",
  "beautifulsoup4>=4.12.0",
  "httpx>=0.28.1",
  "lark>=1.2.0",
  "py-subtitle-extractor>=1.0.6",
  "pykakasi>=2.3.0",
  "rich>=13.9.4",
  "typer>=0.15.1",
  "whenever>=0.11.0",
  "yt-dlp>=2025.1.26",
]

[project.scripts]
download-anpanman = "homelab_scripts.download_anpanman:main"
download-numberblocks = "homelab_scripts.download_numberblocks:main"
build-anpanman-metadata = "homelab_scripts.build_anpanman_metadata:main"
build-maruko-metadata = "homelab_scripts.build_maruko_metadata:main"
sync-maruko = "homelab_scripts.sync_maruko:main"
jellyfin-scan = "homelab_scripts.jellyfin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_scripts"]

