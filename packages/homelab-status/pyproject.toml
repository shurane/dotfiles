[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-status"
version = "0.1.0"
description = "Fast, typed CLI health and status monitor for homelab services"
requires-python = "==3.14.*"
dependencies = [
  "homelab-core",
  "anyio>=4.8.0",
  "docker>=7.1.0",
  "httpx>=0.28.1",
  "humanize>=4.9.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "typer>=0.12.5",
  "whenever>=0.11.0",
]

[project.scripts]
homelab-status = "homelab_status.main:app"
status = "homelab_status.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_status"]

