[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-core"
version = "0.1.0"
description = "Core utilities, environment discovery, services, and networking for homelab tools"
requires-python = "==3.14.*"
dependencies = [
  "docker>=7.1.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "whenever>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_core"]

