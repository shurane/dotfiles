[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-auth"
version = "0.1.0"
description = "Deterministic authentication bootstrapper and credential manager for homelab"
requires-python = "==3.14.*"
dependencies = [
  "anyio>=4.8.0",
  "bcrypt>=5.0.0",
  "docker>=7.1.0",
  "httpx>=0.28.1",
  "pydantic>=2.10.0",
  "rich>=13.0.0",
  "trio>=0.27.0",
  "typer>=0.12.5",
  "werkzeug>=3.0.0",
  "whenever>=0.11.0",
]

[project.scripts]
homelab-auth = "homelab_auth.cli:typer_main"
auth = "homelab_auth.cli:typer_main"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
