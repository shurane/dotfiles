services:
  bootstrap-auth:
    build:
      context: .
    image: homelab-bootstrap-auth
    working_dir: /homelab
    environment:
      QBITTORRENT_URL: http://qbittorrent:8080
      QUI_URL: http://qui:7476
      ARCANE_URL: http://arcane:3552
      JELLYFIN_URL: http://jellyfin:8096
    networks:
      - proxy-tier
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/homelab
      - uv-cache:/root/.cache/uv

networks:
  proxy-tier:
    external: true

volumes:
  uv-cache:
