[project]
name = "homelab-bootstrap-auth"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "anyio>=4.7.0",
  "docker>=7.1.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "trio>=0.27.0",
  "typer>=0.16.0",
  "werkzeug>=3.0.0",
]

[project.scripts]
bootstrap-auth = "bootstrap_auth.cli:typer_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bootstrap_auth"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["bootstrap_auth", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF", "ANN"]
ignore = [
  # Typer uses Option(...) calls as defaults by design.
  "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
