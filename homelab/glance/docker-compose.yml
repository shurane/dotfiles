services:
  glance:
    image: glanceapp/glance:latest
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
    networks:
      - proxy-tier
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      caddy: ${HOSTNAME_BASE:?err}, ${HOSTNAME_ALIAS_BASE:-m.lan}
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8080}}"

networks:
  proxy-tier:
    external: true
