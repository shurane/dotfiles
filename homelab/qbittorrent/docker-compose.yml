services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Los_Angeles
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "21354"
    networks:
      - proxy-tier
    ports:
      - "21354:21354"
      - "21354:21354/udp"
    volumes:
      - ./config:/config
      - /mnt/mango/torrents:/mnt/mango/torrents
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      caddy: qbittorrent.${HOSTNAME_BASE:?err}, qbittorrent.${HOSTNAME_ALIAS_BASE:-m.lan}
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8080}}"

networks:
  proxy-tier:
    external: true
