services:
  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./wireguard.conf:/gluetun/wireguard/wg0.conf:ro
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
      FIREWALL_OUTBOUND_SUBNETS: 172.20.0.0/16,${HOMELAB_LAN_SUBNET:?err},100.64.0.0/10
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -qO- --retry-connrefused --header="Referer: http://127.0.0.1:8080" --header="Origin: http://127.0.0.1:8080" --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"tun0\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
    networks:
      proxy-tier:
        aliases:
          - qbittorrent
    ports:
      - "8080:8080"
    labels:
      caddy: qbittorrent.${HOSTNAME_BASE:?err}
      caddy.reverse_proxy: "{{upstreams 8080}}"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Los_Angeles
      WEBUI_PORT: "8080"
    volumes:
      - ./config:/config
      - /mnt/mango/torrents:/mnt/mango/torrents
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy-tier:
    external: true
