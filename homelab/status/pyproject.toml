[project]
name = "homelab-status"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "anyio>=4.7.0",
  "docker>=7.1.0",
  "httpx>=0.27.0",
  "paramiko>=3.5.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "typer>=0.16.0",
]

[project.scripts]
homelab-status = "main:app"
homelab_status = "main:app"
status = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["config.py", "main.py", "models.py", "services"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF", "ANN"]
ignore = [
  # Typer uses Option(...) calls as defaults by design.
  "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
