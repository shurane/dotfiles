[project]
name = "homelab-status"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
  "anyio>=4.7.0",
  "docker>=7.1.0",
  "httpx>=0.27.0",
  "paramiko>=3.5.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "typer>=0.16.0",
]

[project.scripts]
homelab-status = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["config.py", "main.py", "models.py", "services"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.16.1",
  "ty>=0.0.95",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = [".", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "UP",     # pyupgrade (Python 3.14 idioms)
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "C4",     # flake8-comprehensions
  "PIE",    # flake8-pie
  "RUF",    # Ruff-specific rules
  "ANN",    # flake8-annotations
  "ASYNC",  # flake8-async
  "PT",     # flake8-pytest-style
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "SLF",    # flake8-self
  "PERF",   # Perflint
  "FURB",   # refurb
  "FLY",    # flynt
  "FA",     # flake8-future-annotations
  "T20",    # flake8-print
]
ignore = [
  "B008",    # Typer uses Option(...) / Argument(...) as function defaults by design
  "ANN401",  # Any allowed where appropriate for dynamic data/JSON
  "T201",    # CLI console prints are intentional in entrypoint
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "SLF001", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
