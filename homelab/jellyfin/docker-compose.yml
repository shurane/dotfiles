services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "985"
      - "989"
    environment:
      HOME: /config
      TZ: America/Los_Angeles
    devices:
      - /dev/dri:/dev/dri
    networks:
      - proxy-tier
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/mango:/mnt/mango:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      caddy: jellyfin.${HOSTNAME_BASE:?err}, jellyfin.${HOSTNAME_ALIAS_BASE:-m.lan}
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8096}}"

networks:
  proxy-tier:
    external: true
