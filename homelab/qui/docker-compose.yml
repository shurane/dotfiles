services:
  qui:
    image: ghcr.io/autobrr/qui:latest
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - proxy-tier
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:7476"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      caddy: qui.${HOSTNAME_BASE:?err}, qui.${HOSTNAME_ALIAS_BASE:-m.lan}
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 7476}}"

networks:
  proxy-tier:
    external: true
