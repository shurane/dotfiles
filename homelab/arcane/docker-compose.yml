services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: http://arcane.${HOSTNAME_BASE:?err}
      PUID: "1000"
      PGID: "1000"
    networks:
      - proxy-tier
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - ./backups:/backups
      - ./builds:/builds
      - ..:/app/data/projects
    healthcheck:
      test: ["CMD", "/app/arcane", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      caddy_0: http://arcane.${HOSTNAME_BASE:?err}, http://arcane.${HOSTNAME_ALIAS_BASE:-m.lan}
      caddy_0.reverse_proxy: "{{upstreams 3552}}"
      caddy_1: https://arcane.${HOSTNAME_BASE:?err}, https://arcane.${HOSTNAME_ALIAS_BASE:-m.lan}
      caddy_1.tls: internal
      caddy_1.reverse_proxy: "{{upstreams 3552}}"

volumes:
  arcane-data:

networks:
  proxy-tier:
    external: true
