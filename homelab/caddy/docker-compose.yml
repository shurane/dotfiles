services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
    environment:
      CADDY_INGRESS_NETWORKS: proxy-tier
    networks:
      - proxy-tier
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "/bin/caddy", "validate", "--config", "/config/caddy/autosave.json"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  caddy-data:
  caddy-config:

networks:
  proxy-tier:
    external: true
