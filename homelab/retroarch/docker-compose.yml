services:
  rclone-retroarch:
    image: rclone/rclone:latest
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - proxy-tier
    volumes:
      - /srv/retroarch:/data
    command: ["--config", "/dev/null", "serve", "webdav", "/data", "--addr", ":8080", "--timeout", "10m", "--contimeout", "3m", "--log-level", "INFO"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1:8080/manifest.server"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      caddy: retroarch.${HOSTNAME_BASE:?err}, retroarch.${HOSTNAME_ALIAS_BASE:-m.lan}
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8080}}"

networks:
  proxy-tier:
    external: true
