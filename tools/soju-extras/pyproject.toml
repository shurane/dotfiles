[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soju-extras"
version = "0.1.0"
description = "Modern Python 3.14 toolkit for Soju IRC bouncer (sojugrep, soju-export-fs, weechat-to-soju)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10.0",
    "rich>=13.0.0",
    "whenever>=0.10,<0.11",
]

[project.scripts]
soju-backup = "soju_extras.backup.cli:main"
sojugrep = "soju_extras.grep.cli:main"
soju-export-fs = "soju_extras.export_fs.cli:main"
weechat-to-soju = "soju_extras.importer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soju_extras"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src"]

[tool.ty.rules]
unused-ignore-comment = "error"
missing-type-argument = "error"
