[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sojugrep"
version = "0.1.0"
description = "Instant FTS5 full-text search across Soju SQLite IRC backlog"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10.0",
]

[project.scripts]
sojugrep = "sojugrep.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
